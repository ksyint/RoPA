model:
  name: vjepa2_giant
  pretrained: facebook/vjepa2-vitg-fpc64-384
  cache_dir: null
  local_files_only: false
  revision: main
  target_range: 640.0
  local_scale: 1.0
  tubelet: 2
  causal: true
  gradient_checkpointing: true
data:
  frames: 16
runtime:
  seed: 42
  batch_size: 1
  steps: 100000
optim:
  lr: 3.0e-06
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.95
objective:
  lambda_gram: 1.0
  lambda_rope: 0.01
  gram_warmup: 5000
  sample_patches: 64
  prediction_offset: 2
spacing:
  enabled: false
  low: 1.0
  high: 1.0
